<html lang="en"><head><meta charset="utf-8">

<title>FuelFlow</title><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="FuelFlow"><meta name="theme-color" content="#0B0D12">
<style>
:root{color-scheme:dark;--bg:#0B0D12;--s1:#171B24;--s2:#202532;--tx:#F5F6FA;--mu:#9CA3B3;--or:#FF824D;--bd:rgba(255,255,255,.08);--p:#4C8DFF;--c:#FFC24D;--f:#A76BFF;--w:#35D0E8;--g:#3DDC97;--na:#FF6B9A;

*,*::before,*::after{box-sizing:inherit;min-width:0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,"SF Pro Text",Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{overflow-x:hidden}
#app{height:100%;overflow-y:auto;overflow-x:hidden;padding:16px 16px calc(90px + env(safe-area-inset-bottom,0px))}
h1{font-size:26px;margin:4px 0 14px}h2{font-size:13px;margin:0 0 10px;color:var(--mu);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:20px;padding:16px;margin-bottom:14px;animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.big{font-size:34px;font-weight:700;letter-spacing:-.02em}.u{font-size:13px;color:var(--mu);margin-left:5px;font-weight:500}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.mu{color:var(--mu);font-size:13px}
.bar{height:9px;border-radius:9px;background:var(--s2);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;border-radius:9px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.mb{margin-bottom:13px}
button,input,select{font:inherit;color:var(--tx)}
input,select{width:100%;background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:11px 12px;outline:none}
input:focus{border-color:var(--or)}
.btn{background:var(--or);color:#1a0d05;border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer;transition:transform .1s}
.btn:active,.chip:active{transform:scale(.95)}.btn.g{background:var(--s2);color:var(--tx)}.btn.d{background:#3a1d22;color:#ff8a8a}
.chip{background:var(--s2);border:1px solid var(--bd);border-radius:999px;padding:9px 14px;cursor:pointer;white-space:nowrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.item{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid var(--bd);cursor:pointer}
.item:first-of-type{border-top:0}.item b{font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(23,27,36,.92);backdrop-filter:blur(16px);border-top:1px solid var(--bd);padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;background:none;border:0;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;cursor:pointer}
nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--or)}
#sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:9}
#sheetbg.on{display:flex}
#sheet{width:100%;max-height:88%;overflow-y:auto;background:var(--s1);border-radius:24px 24px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px));animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:end}.mt{margin-top:10px}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px}
.empty{color:var(--mu);text-align:center;padding:18px 6px}
.ok{color:var(--g)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:700px){#app{max-width:640px;margin:0 auto}nav{justify-content:center}nav button{max-width:110px}}
input,select{height:44px;display:block;max-width:100%}
input[type=date]{-webkit-appearance:none;appearance:none;min-width:0;line-height:20px}
input[type=date]::-webkit-date-and-time-value{text-align:left;min-height:1.2em}
nav button{font-size:10px}nav svg{width:22px;height:22px}
summary{cursor:pointer;font-weight:600;list-style:none}summary::-webkit-details-marker{display:none}summary::after{content:" ›";color:var(--mu)}details[open]>summary::after{content:" ⌄"}
details>summary+*{margin-top:10px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.dw{text-align:center;font-size:11px;color:var(--mu)}
.cd{background:var(--s2);border:1px solid transparent;border-radius:10px;padding:4px 2px;min-height:58px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-size:13px}
.cd.off{opacity:.25;pointer-events:none}.cd.pl{background:#2a2430}.cd.sel{border-color:var(--or)}.cd.td b{color:var(--or)}
.cd small{font-size:9px;color:var(--mu);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dots{display:flex;gap:3px;min-height:6px}.dots i{width:6px;height:6px;border-radius:50%}
.item>:first-child{flex:1}.item>:last-child{flex:none;max-width:55%}
.lf{display:flex;gap:12px;align-items:center}.lf>div:last-child{min-width:0}
.th{position:relative;width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,#2a3042,#1b2030);flex:none;overflow:hidden;display:grid;place-items:center;font-size:22px}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

function today(){return new Date().toLocaleDateString("sv")}
function load(){try{const x=JSON.parse(localStorage.getItem("fuelflow.v1"));return x?Object.assign({},D,x):JSON.parse(JSON.stringify(D))}catch(e){return JSON.parse(JSON.stringify(D))}}

// ---------- calculations (single source of truth) ----------
function nut(e){const m=e.g/100;const o={k:e.k*m,p:e.p*m,c:e.c*m,f:e.f*m};o.fi=e.fi==null?null:e.fi*m;o.na=e.na==null?null:e.na*m;return o}
function totals(d){const t={k:0,p:0,c:0,f:0,fi:0,na:0,fiMiss:0,naMiss:0,n:0};
 S.food.filter(e=>e.date===d).forEach(e=>{const n=nut(e);t.n++;["k","p","c","f"].forEach(x=>t[x]+=n[x]);
 if(n.fi==null)t.fiMiss++;else t.fi+=n.fi;if(n.na==null)t.naMiss++;else t.na+=n.na});return t}

function bar(label,v,goal,unit,col){const has=goal>0;const pct=has?Math.min(100,v/goal*100):0;
 return `<div class="mb"><div class="row"><span>${label}</span><span><b>${r1(v)}</b>${has?` / ${r0(goal)}`:""}<span class="u">${unit}</span>${has?`<span class="u">${Math.round(v/goal*100)}%</span>`:`<span class="u">no goal set</span>`}</span></div><div class="bar" role="progressbar" aria-valuenow="${Math.round(pct)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%;background:${col}"></i></div></div>`}
function ring(v,goal){const R=54,C=2*Math.PI*R;const pct=goal>0?Math.min(1,v/goal):0;
 return `<svg viewBox="0 0 130 130" width="130" height="130" style="flex:none"><circle cx="65" cy="65" r="${R}" fill="none" stroke="var(--s2)" stroke-width="12"/><circle cx="65" cy="65" r="${R}" fill="none" stroke="var(--or)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}" transform="rotate(-90 65 65)" style="transition:stroke-dashoffset .6s ease"/><text x="65" y="71" text-anchor="middle" fill="#F5F6FA" font-size="22" font-weight="700">${goal>0?Math.round(v/goal*100)+"%":"—"}</text></svg>`}
function dateBar(){return `<div class="row mb"><button class="chip" onclick="shift(-1)">‹</button><input type="date" value="${date}" onchange="date=this.value||today();render()" style="text-align:center;max-width:170px"><button class="chip" onclick="shift(1)">›</button></div>`}
function shift(n){const d=new Date(date+"T12:00:00");d.setDate(d.getDate()+n);date=d.toLocaleDateString("sv");render()}
function weightChart(){const pts=[...S.weight].sort((a,b)=>a.date<b.date?-1:1);

 const W=320,H=170,P=28;const ws=pts.map(p=>p.kg);let lo=Math.min(...ws),hi=Math.max(...ws);if(hi-lo<1){lo-=.5;hi+=.5}
 const t0=new Date(pts[0].date).getTime(),t1=new Date(pts[pts.length-1].date).getTime();
 const X=p=>pts.length===1||t1===t0?W/2:P+(new Date(p.date).getTime()-t0)/(t1-t0)*(W-2*P);
 const Y=p=>H-P-(p.kg-lo)/(hi-lo)*(H-2*P);
 const line=pts.length>1?`<polyline fill="none" stroke="var(--or)" stroke-width="2.5" stroke-linejoin="round" points="${pts.map(p=>X(p)+","+Y(p)).join(" ")}"/>`:"";
 const dots=pts.map(p=>`<circle cx="${X(p)}" cy="${Y(p)}" r="5" fill="var(--or)"><title>${p.date}: ${p.kg} kg</title></circle>`).join("");
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block"><text x="4" y="${P}" fill="#9CA3B3" font-size="10">${hi.toFixed(1)}</text><text x="4" y="${H-P+4}" fill="#9CA3B3" font-size="10">${lo.toFixed(1)}</text><text x="${P}" y="${H-6}" fill="#9CA3B3" font-size="10">${pts[0].date.slice(5)}</text><text x="${W-P}" y="${H-6}" text-anchor="end" fill="#9CA3B3" font-size="10">${pts[pts.length-1].date.slice(5)}</text>${line}${dots}</svg>`}
